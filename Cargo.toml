[workspace]
resolver = "2"
members = [
  "apps/api",
  "crates/doseark_domain",
  "crates/doseark_application",
  "crates/doseark_contracts",
  "crates/doseark_db_postgres",
  "crates/doseark_db_sqlite",
  "crates/doseark_runtime_config",
]

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["ArchitektPiramid"]
rust-version = "1.80"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "sqlite",
  "uuid",
  "chrono",
  "migrate",
] }
thiserror = "2"
tokio = { version = "1.52", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1", features = ["serde", "v4"] }
tracing-appender = "0.2"
